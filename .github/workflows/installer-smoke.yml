name: Installer smoke

# Builds unsigned Windows NSIS/MSI packages with tauri.local.conf.json and runs
# the existing smoke scripts. Not on every PR: full packaging is expensive.
# Trigger manually or via the nightly schedule before a release.

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC daily
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: installer-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-installer-smoke:
    name: Windows NSIS and MSI smoke
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: installer-smoke-x86_64-pc-windows-msvc

      - name: Install WiX Toolset (MSI)
        shell: pwsh
        run: |
          function Resolve-WixBin {
            $command = Get-Command candle.exe -ErrorAction SilentlyContinue
            if ($command) { return $command.Source | Split-Path -Parent }

            $candidates = @(
              'C:\Program Files (x86)\WiX Toolset v3.14\bin',
              'C:\Program Files (x86)\WiX Toolset v3.11\bin',
              'C:\Program Files\WiX Toolset v3.14\bin'
            )
            $candidate = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if ($candidate) { return $candidate }

            $found = Get-ChildItem -Path 'C:\Program Files (x86)', 'C:\Program Files' -Filter 'candle.exe' -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) { return $found.DirectoryName }

            return $null
          }

          $wixBin = Resolve-WixBin
          if (-not $wixBin) {
            choco install wixtoolset -y --no-progress
            $wixBin = Resolve-WixBin
          }
          if (-not $wixBin) {
            throw 'WiX bin directory not found after install.'
          }
          echo "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "WiX on PATH: $wixBin"
          & (Join-Path $wixBin 'candle.exe') -? | Select-Object -First 1

      - name: Install Svelte frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # Unsigned local package build (createUpdaterArtifacts disabled via tauri.local.conf.json).
      - name: Build local Windows installers
        run: npm run build:tauri:local

      - name: Smoke release executable startup
        run: npm run smoke:release

      - name: Smoke MSI artifact extract and launch
        run: npm run smoke:msi

      - name: Smoke NSIS install, launch, and uninstall
        run: npm run smoke:installer

      - name: Upload installer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplefile-windows-installers
          path: |
            src-tauri/target/release/simplefile.exe
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
          if-no-files-found: warn
          retention-days: 14
