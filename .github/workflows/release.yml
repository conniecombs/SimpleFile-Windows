name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example v1.0.0'
        required: true
        type: string
      draft:
        description: 'Create the GitHub release as a draft'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      draft: ${{ steps.version.outputs.draft }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            DRAFT="${{ github.event.inputs.draft }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            DRAFT="true"
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v1.0.0 or v1.0.0-beta.1" >&2
            exit 1
          fi

          MANIFEST_VERSION="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          CARGO_VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' src-tauri/Cargo.toml | head -n1)"
          TAG_VERSION="${VERSION#v}"

          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ] || [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: tag=$TAG_VERSION tauri.conf.json=$MANIFEST_VERSION Cargo.toml=$CARGO_VERSION" >&2
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"

  checks:
    name: Release quality gates
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: release-quality

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --all-features

      - name: Install Svelte frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend checks
        run: npm run check

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: node scripts/cargo-audit-release.mjs

  build:
    name: Build ${{ matrix.name }}
    needs: [validate, checks]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Svelte frontend dependencies
        run: npm ci --prefix frontend

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.target }}-release

      - name: Install WiX Toolset (MSI)
        shell: pwsh
        run: |
          function Resolve-WixBin {
            $command = Get-Command candle.exe -ErrorAction SilentlyContinue
            if ($command) { return $command.Source | Split-Path -Parent }

            $candidates = @(
              'C:\Program Files (x86)\WiX Toolset v3.14\bin',
              'C:\Program Files (x86)\WiX Toolset v3.11\bin',
              'C:\Program Files\WiX Toolset v3.14\bin'
            )
            $candidate = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if ($candidate) { return $candidate }

            $found = Get-ChildItem -Path 'C:\Program Files (x86)', 'C:\Program Files' -Filter 'candle.exe' -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) { return $found.DirectoryName }

            return $null
          }

          $wixBin = Resolve-WixBin
          if (-not $wixBin) {
            choco install wixtoolset -y --no-progress
            $wixBin = Resolve-WixBin
          }
          if (-not $wixBin) {
            throw 'WiX bin directory not found after install.'
          }
          echo "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "WiX on PATH: $wixBin"
          & (Join-Path $wixBin 'candle.exe') -? | Select-Object -First 1

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY repository secret is required to build signed updater artifacts."
            echo "::error::Generate it with 'cargo tauri signer generate --write-keys .secrets/simplefile-updater.key', then store the private key content as the secret."
            exit 1
          fi

      - name: Build signed Windows installers and portable executable
        working-directory: src-tauri
        shell: pwsh
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --ci --target $env:TARGET_TRIPLE --bundles nsis,msi

      - name: Stage release assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          $root = (Get-Location).Path
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $assetsDir = Join-Path $root 'release-assets'
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null

          $releaseRoots = @(
            Join-Path $root "src-tauri\target\$env:TARGET_TRIPLE\release",
            Join-Path $root 'src-tauri\target\release'
          )
          $releaseRoot = $releaseRoots |
            Where-Object { Test-Path -LiteralPath (Join-Path $_ 'simplefile.exe') } |
            Select-Object -First 1
          if (-not $releaseRoot) {
            throw "No release executable found under: $($releaseRoots -join ', ')"
          }

          $portableName = "SimpleFile_${version}_x64-portable.exe"
          $portableExe = Join-Path $assetsDir $portableName
          Copy-Item -LiteralPath (Join-Path $releaseRoot 'simplefile.exe') -Destination $portableExe -Force
          Compress-Archive -LiteralPath $portableExe -DestinationPath (Join-Path $assetsDir "SimpleFile_${version}_x64-portable.zip") -Force

          $bundleRoot = Join-Path $releaseRoot 'bundle'
          $bundleFiles = Get-ChildItem -Path (Join-Path $bundleRoot 'nsis\*'), (Join-Path $bundleRoot 'msi\*') -File -ErrorAction SilentlyContinue
          if (-not $bundleFiles) {
            throw "No NSIS/MSI bundle files found under $bundleRoot."
          }

          foreach ($file in $bundleFiles) {
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $assetsDir $file.Name) -Force
          }

          $assets = Get-ChildItem -LiteralPath $assetsDir -File
          if (-not ($assets | Where-Object { $_.Name -like 'SimpleFile_*_x64-setup.exe' })) {
            throw 'NSIS setup executable was not staged.'
          }
          if (-not ($assets | Where-Object { $_.Name -like 'SimpleFile_*_x64_en-US.msi' })) {
            throw 'MSI installer was not staged.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $assetsDir "SimpleFile_${version}_x64-portable.zip"))) {
            throw 'Portable zip was not staged.'
          }
          if (-not ($assets | Where-Object { $_.Name -eq 'latest.json' })) {
            throw 'Updater latest.json was not staged.'
          }
          if (-not ($assets | Where-Object { $_.Extension -eq '.sig' })) {
            throw 'Updater signature files were not staged.'
          }

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## Release assets'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '| File | Size |'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '| --- | ---: |'
          foreach ($asset in ($assets | Sort-Object Name)) {
            $sizeMb = [Math]::Round($asset.Length / 1MB, 2)
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| ``$($asset.Name)`` | $sizeMb MB |"
          }

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          name: SimpleFile ${{ needs.validate.outputs.version }}
          body: |
            ## SimpleFile ${{ needs.validate.outputs.version }}

            Windows installer and portable artifacts are attached below:
            - NSIS setup executable for standard per-user installation.
            - MSI installer for managed deployment.
            - Portable zip containing the standalone executable.
            - Signed updater artifacts, signatures, and latest.json.

            See [docs/CHANGELOG.md](https://github.com/conniecombs/SimpleFile-Windows/blob/main/docs/CHANGELOG.md) for release notes and upgrade details.
          draft: true
          prerelease: ${{ needs.validate.outputs.prerelease }}
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish release
    needs: [validate, build]
    if: needs.validate.outputs.draft == 'false'
    runs-on: ubuntu-22.04
    steps:
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          draft: false
          prerelease: ${{ needs.validate.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
