[package]
name = "simplefile-service"
version = "1.1.0"
description = "SimpleFile named-pipe JSON-RPC IPC service"
authors = ["SimpleFile Team"]
license-file = "../../LICENSE"
repository = "https://github.com/conniecombs/SimpleFile-Windows"
edition = "2021"

[lib]
name = "simplefile_service"
path = "src/lib.rs"

[[bin]]
name = "simplefile-service"
path = "src/main.rs"

[[bin]]
name = "simplefile-ipc-client"
path = "src/bin/ipc_client.rs"

[dependencies]
chrono = "0.4"
glob = "0.3"
notify = { version = "8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplefile-core = { path = "../simplefile-core" }
simplefile-ipc = { path = "../simplefile-ipc" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
